# The Python packages of the panel pipeline (plan, detect, status, assemble, checks)
# and of the marimo notebooks. `uv sync` installs them; uv.lock holds the exact version
# of every package, for the Mac and for Goethe at once. Edit this file, run `uv lock`,
# commit both. Never edit uv.lock by hand.
#
# The versions are the ones on Ruby's Mac in Sept 2026 (constraint-dependencies below),
# the versions every score so far was made with. Changing one of the scoring packages
# (tensorflow, keras, numpy, h5py, earthengine-api) can change scores: don't, mid-panel.

[project]
name = "amw-panel"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    # scoring
    "tensorflow==2.14.0",
    # On an Apple-chip Mac, tensorflow 2.14 is a thin wrapper around this package. uv
    # reads tensorflow's needs from its Linux file and so misses it: named here by hand.
    "tensorflow-macos==2.14.0; sys_platform == 'darwin'",
    "keras==2.14.0",
    "numpy==1.26.4",
    "h5py==3.16.0",
    # Earth Engine and AMW's downloader (core/gee.py)
    "earthengine-api==1.7.35",
    "google-api-core==2.30.3",
    "google-auth==2.56.0",
    # tiles and chips (core/tile_utils.py)
    "descarteslabs==2.1.2",
    "geopandas==1.1.0",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "rasterio==1.4.4",
    "affine==2.4.0",
    # tables
    "pandas==3.0.3",
    "pyarrow==25.0.0",
    "PyYAML==6.0.3",
    # AMW's postprocess.py (isolation rule)
    "scikit-learn",
    # notebooks and figures
    "matplotlib==3.11.0",
    "marimo",
    "altair",
]

[tool.uv]
# Not a package to install, just a folder of scripts: uv only manages the environment.
package = false
# Lock only for the two machines we use: Ruby's Mac (Apple chip) and Goethe (Linux).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Reuse the Sept 2026 versions for everything they cover (from
# requirements/constraints-amw-2026-09-18.txt), so nothing that scores changes.
